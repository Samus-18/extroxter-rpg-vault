plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.extroxter.cacheprobe'
version = '1.0.0'

def forgeVersion = providers.gradleProperty('forge_version').orElse('1.20.1-47.4.10')

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.theillusivec4.top/') }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forgeVersion.get()}"
    implementation fg.deobf('maven.modrinth:8BmcQJ2H:RBA7lJaW')
    implementation fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
