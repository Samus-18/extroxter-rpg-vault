name: Glyphbound Offline Build Cache

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  prepare-offline-cache:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref, 'agent/glyphbound-cache-run')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/glyphbound-gradle-home
    steps:
      - name: Report cache run ID
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, body: `GLYPHBOUND_CACHE_RUN_STARTED=${context.runId}`});

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-disabled: true

      - name: Create public dependency probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/src/main/java/com/extroxter/cacheprobe
          cat > probe/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.minecraftforge.net/' }
                  mavenCentral()
              }
          }
          rootProject.name = 'glyphbound_cache_probe'
          EOF
          cat > probe/build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }
          group = 'com.extroxter.cacheprobe'
          version = '1.0.0'
          def forgeVersion = providers.gradleProperty('forge_version').orElse('1.20.1-47.4.10')
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft { mappings channel: 'official', version: '1.20.1' }
          repositories {
              mavenCentral()
              maven { url = uri('https://maven.theillusivec4.top/') }
              maven {
                  url = 'https://api.modrinth.com/maven'
                  content { includeGroup 'maven.modrinth' }
              }
          }
          dependencies {
              minecraft "net.minecraftforge:forge:${forgeVersion.get()}"
              implementation fg.deobf('maven.modrinth:8BmcQJ2H:RBA7lJaW')
              implementation fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          EOF
          cat > probe/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G
          org.gradle.daemon=false
          forge_version=1.20.1-47.4.10
          EOF
          cat > probe/src/main/java/com/extroxter/cacheprobe/DependencyProbe.java <<'EOF'
          package com.extroxter.cacheprobe;
          public final class DependencyProbe { private DependencyProbe() {} }
          EOF

      - name: Resolve Forge and library dependencies
        working-directory: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME"
          gradle --version
          gradle compileJava --no-daemon --stacktrace --refresh-dependencies -Pforge_version=1.20.1-47.4.10 | tee "$GITHUB_WORKSPACE/glyphbound-cache-build.log"
          gradle dependencies --configuration compileClasspath --no-daemon -Pforge_version=1.20.1-47.4.10 | tee "$GITHUB_WORKSPACE/glyphbound-cache-dependencies.log"

      - name: Package portable toolchain and cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-cache
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_INSTALL="$(dirname "$(dirname "$GRADLE_BIN")")"
          echo "JAVA_HOME=$JAVA_HOME" > offline-cache/paths.txt
          echo "GRADLE_INSTALL=$GRADLE_INSTALL" >> offline-cache/paths.txt
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> offline-cache/paths.txt
          tar -czf offline-cache/jdk17.tar.gz -C "$(dirname "$JAVA_HOME")" "$(basename "$JAVA_HOME")"
          tar -czf offline-cache/gradle-8.8.tar.gz -C "$(dirname "$GRADLE_INSTALL")" "$(basename "$GRADLE_INSTALL")"
          tar -czf offline-cache/gradle-cache.tar.gz -C "$(dirname "$GRADLE_USER_HOME")" "$(basename "$GRADLE_USER_HOME")"
          sha256sum offline-cache/*.tar.gz > offline-cache/SHA256SUMS.txt
          du -h offline-cache/*

      - name: Upload JDK 17
        uses: actions/upload-artifact@v4
        with:
          name: glyphbound-offline-jdk17
          path: offline-cache/jdk17.tar.gz
          compression-level: 0
          retention-days: 3

      - name: Upload Gradle 8.8
        uses: actions/upload-artifact@v4
        with:
          name: glyphbound-offline-gradle-8.8
          path: offline-cache/gradle-8.8.tar.gz
          compression-level: 0
          retention-days: 3

      - name: Upload Forge dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: glyphbound-offline-forge-cache
          path: |
            offline-cache/gradle-cache.tar.gz
            offline-cache/SHA256SUMS.txt
            offline-cache/paths.txt
            glyphbound-cache-build.log
            glyphbound-cache-dependencies.log
          compression-level: 0
          retention-days: 3

      - name: Report cache success
        if: success() && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, body: `GLYPHBOUND_CACHE_RUN_SUCCESS=${context.runId}`});

      - name: Report cache failure
        if: failure() && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, body: `GLYPHBOUND_CACHE_RUN_FAILURE=${context.runId}`});
